name: correctness-and-smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Guest sessions use native crypto; persistence uses node:sqlite (Node >=24.7).
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run benchmark -- --games 4 --concurrency 2 --opening-plies 0 --move-ms 60000 --max-plies 256
      - shell: bash
        run: |
          for replay in artifacts/*/games.jsonl; do
            node scripts/verify-replays.mjs --run "$(dirname "$replay")"
          done

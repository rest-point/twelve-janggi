<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모델 대전 · twelve-janggi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/experiments.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="site-header"><a class="brand" href="/" aria-label="twelve-janggi 홈"><span class="brand-mark">十<span>二</span></span><span>twelve<span class="brand-light">-janggi</span></span></a><nav aria-label="주요 메뉴"><a href="/">플레이</a><a class="nav-active" href="/experiments" aria-current="page">모델 대전</a><a href="/records">로컬 기록</a></nav></header>
  <main id="main">
    <div class="intro"><div><h1>모델 연구소</h1></div><button id="refresh">기록 새로고침 ↻</button></div>
    <form id="model-match-form" class="model-match-form"><label>모델 A<select id="model-a" aria-label="모델 A" required></select></label><span>VS</span><label>모델 B<select id="model-b" aria-label="모델 B" required></select></label><button id="submit-match" type="submit">100국 추가 실행</button><p>첫 수부터 대전 · 선공 각 50국 · 매 턴 60초</p></form>
    <section id="model-introductions" class="model-introductions" aria-labelledby="model-introductions-title">
      <h2 id="model-introductions-title">모델 소개</h2>
      <div class="model-introduction-layout panel">
        <div id="model-list" class="model-list" role="group" aria-label="모델 목록"></div>
        <section id="model-introduction" class="model-introduction" aria-label="선택한 모델 소개"><p class="muted">모델을 선택하세요.</p></section>
      </div>
    </section>
    <div id="notice" role="status" aria-live="polite">기록을 불러오는 중입니다.</div>
    <div class="workspace">
      <aside class="panel"><div class="panel-heading"><h2 id="list-title">모델 조합</h2><span id="run-count"></span></div><div id="runs"></div></aside>
      <section class="detail"><div id="summary" class="panel"><p class="muted">실험을 선택하면 대국 목록이 표시됩니다.</p></div>
        <div class="games-replay">
          <section class="panel game-panel"><div class="panel-heading"><h2>대국 목록</h2><span id="game-count"></span></div><label class="filter">결과 필터<select id="result-filter"><option value="all">전체</option><option value="a">A 승리</option><option value="draw">무승부</option><option value="b">B 승리</option></select></label><div id="games" class="game-list"></div></section>
          <section class="panel replay-panel" aria-labelledby="replay-title"><div class="panel-heading"><h2 id="replay-title">기보 재생</h2><button id="download" disabled>기보 JSON ↓</button></div><div id="game-meta" class="muted">대국을 선택하세요.</div>
            <div id="red-hand" class="hand"></div><div id="replay-board" class="replay-board" role="img" aria-label="기보 게임판"></div><div id="blue-hand" class="hand"></div>
            <div class="playback"><button id="first" aria-label="처음 수로" disabled>⏮</button><button id="prev" aria-label="이전 수" disabled>이전</button><button id="play" disabled>자동 재생</button><button id="next" aria-label="다음 수" disabled>다음</button><button id="last" aria-label="마지막 수로" disabled>⏭</button></div>
            <label class="scrubber">현재 수 <output id="ply-label">0 / 0</output><input id="ply" type="range" min="0" max="0" value="0" disabled></label><p id="move-detail" class="move-detail">초기 국면부터 포로·승격까지 재생합니다.</p>
            <div class="table-wrap"><table><caption>수별 기보와 착수시간</caption><thead><tr><th>수</th><th>진영</th><th>착수</th><th>소요시간</th></tr></thead><tbody id="moves"></tbody></table></div>
          </section>
        </div>
      </section>
    </div>
  </main><footer>twelve-janggi / 모든 비교는 기록으로 남습니다.</footer>
  <script type="module" src="/src/experiments.js"></script>
</body>
</html>
